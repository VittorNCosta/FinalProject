<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Adicionar Nova Tarefa</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style_form.css') }}">
</head>
<body>
  <header>
    <h1>Adicionar Nova Tarefa</h1>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('tarefa.add_tarefa') }}" method="POST" class="task-form">
      <div class="form-group">
        <label for="titulo">Título:</label>
        <input type="text" name="titulo" id="titulo" placeholder="Digite o título da tarefa" required>
      </div>

      <div class="form-group">
        <label for="descricao">Descrição:</label>
        <textarea name="descricao" id="descricao" placeholder="Digite a descrição da tarefa" rows="4" required></textarea>
      </div>

      <div class="form-group">
        <label for="status">Status:</label>
        <select name="status" id="status" required>
          <option value="Pendente">Pendente</option>
          <option value="Concluída">Concluída</option>
        </select>
      </div>

      <div class="form-group">
        <label for="prioridade">Prioridade:</label>
        <select name="prioridade" id="prioridade" required>
          <option value="Baixa">Baixa</option>
          <option value="Média">Média</option>
          <option value="Alta">Alta</option>
        </select>
      </div>
<!--
      <div class="form-group">
        <label for="data_criacao">Horário de Criação:</label>
        <input type="datetime-local" name="data_criacao" id="data_criacao" required>
      </div>
-->
      <div class="form-actions">
        <button type="submit" class="btn btn-add">Salvar Tarefa</button>
        <a href="{{ url_for('tarefa.home') }}" class="btn btn-delete">Cancelar</a>
      </div>
    </form>
  </main>

  <footer>
    <p>Gerenciador de Tarefas - APS-1</p>
  </footer>
</body>
</html>
